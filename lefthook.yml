# Every automatic check in Done. A commit runs the three fast ones, a push the suite, and CI the `ci` hook,
# which is both: `uv run lefthook run ci`. Any `lefthook` command installs the git hooks.

# Agents read every line of this, so print only a failing check's output and the plain-text summary.
colors: false
output:
  - failure
  - summary

pre-commit:
  parallel: true
  jobs: &fast
    - name: format
      run: uv run ruff format --check
    - name: lint
      run: uv run ruff check
    - name: types
      run: uv run pyright

pre-push:
  jobs: &suite
    - name: test
      run: uv run pytest

ci:
  jobs:
    - name: fast
      group:
        parallel: true
        jobs: *fast
    - name: suite
      group:
        jobs: *suite
