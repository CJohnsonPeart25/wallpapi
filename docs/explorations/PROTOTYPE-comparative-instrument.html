<!doctype html>
<!--
  PROTOTYPE, throwaway. Branch prototype/comparative-instrument, never merged.
  Question (wallpapi-wa5.3): which comparative Instrument is built first, and how does it look and behave?
  Four variants on one page, switched by ?variant= and the bar at the bottom (or the arrow keys):
  A pick 1 of n, B drag to order, C endless wall, D winner stays.
  Real data: 240 random Items from your Pool (a read-only copy of wallpapi.db, 2026-10-24); thumbnails load
  from th.wallhaven.cc. Nothing is saved: every "recorded" Judgement lives in memory and is shown on the right
  with a draft of the evidence it might reduce to (the reduction itself is the Instrument seam ticket's).
  Open the file in a browser from the repo, so the vendored Pico resolves.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROTOTYPE comparative Instrument</title>
    <script>
      try { var theme = localStorage.getItem("wallpapi-theme"); } catch (e) {}
      if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
    </script>
    <link rel="stylesheet" href="../../src/wallpapi/web/static/pico.indigo.min.css" />
    <style>
      nav { position: sticky; top: 0; z-index: 5; background: var(--pico-background-color);
            border-bottom: 1px solid var(--pico-muted-border-color); }
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: 1.5rem; align-items: start; }
      @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
      .panel { position: sticky; top: 4.5rem; max-height: calc(100vh - 6rem); overflow: auto; font-size: .8rem; }
      .panel pre { font-size: .7rem; white-space: pre-wrap; padding: .5rem; margin: 0 0 .75rem; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .25rem .75rem; margin-bottom: .75rem; }
      .stats b { font-variant-numeric: tabular-nums; }
      .hint { color: var(--pico-muted-color); font-size: .85rem; margin: 0 0 1rem; }
      img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: .4rem; }
      .tile { position: relative; cursor: pointer; aspect-ratio: 16 / 9; border-radius: .5rem; outline-offset: 3px;
              transition: transform .08s; }
      .tile:hover { transform: scale(1.01); outline: 2px solid var(--pico-primary); }
      .key { position: absolute; left: .4rem; top: .4rem; background: #000a; color: #fff; border-radius: .3rem;
             padding: 0 .45rem; font-size: .8rem; font-weight: 600; }
      /* A */
      .pick { display: grid; gap: 1rem; }
      .pick.n2 { grid-template-columns: repeat(2, 1fr); }
      .pick.n3 { grid-template-columns: repeat(3, 1fr); }
      .pick.n4 { grid-template-columns: repeat(2, 1fr); }
      .pick.n6 { grid-template-columns: repeat(3, 1fr); }
      /* B */
      .order { display: grid; grid-template-columns: repeat(5, 1fr); gap: .75rem; }
      .order .tile { cursor: grab; }
      .order .tile.dragging { opacity: .35; }
      .order .tile.over { outline: 3px dashed var(--pico-primary); }
      .rank { position: absolute; right: .4rem; top: .4rem; background: var(--pico-primary-background);
              color: var(--pico-primary-inverse); border-radius: 999px; width: 1.6rem; height: 1.6rem;
              display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
      /* C */
      .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); gap: .4rem; }
      .wall .tile:hover { transform: none; }
      .wall .tile.plucked { outline: 4px solid var(--pico-primary); }
      .wall .tile.plucked::after { content: "★"; position: absolute; right: .35rem; top: .1rem; color: #fff;
                                   text-shadow: 0 0 4px #000; font-size: 1.2rem; }
      .pagebreak { grid-column: 1 / -1; font-size: .7rem; color: var(--pico-muted-color);
                   border-top: 1px dashed var(--pico-muted-border-color); padding-top: .2rem; }
      /* D */
      .duel { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
      .champ { position: absolute; left: .4rem; bottom: .4rem; background: #000b; color: #ffd75e;
               border-radius: .3rem; padding: .1rem .5rem; font-weight: 600; font-size: .85rem; }
      /* the switcher: not part of any design */
      #switcher { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 10;
                  display: flex; gap: .75rem; align-items: center; background: #111; color: #fff;
                  padding: .4rem .9rem; border-radius: 999px; box-shadow: 0 4px 18px #0007; font: 600 .9rem system-ui; }
      #switcher button { all: unset; cursor: pointer; padding: 0 .4rem; font-size: 1.1rem; }
      #switcher .tag { background: #e33; border-radius: .3rem; padding: 0 .35rem; font-size: .65rem; }
    </style>
  </head>

        </aside>
      </div>
    </main>

      <button id="prev" aria-label="Previous variant">←</button>

      <button id="next" aria-label="Next variant">→</button>

      const VARIANTS = { A: "Pick 1 of n", B: "Drag to order", C: "Endless wall", D: "Winner stays" };
      const KEYS = Object.keys(VARIANTS);
      const params = new URLSearchParams(location.search);
      const variant = KEYS.includes(params.get("variant")) ? params.get("variant") : "A";
      const stage = document.getElementById("stage");
      const actions = document.getElementById("actions");

      // A shuffled deck over the Pool, endless: the prototype never runs dry.
      let deck = [];
      function draw(n) {
        const out = [];
        while (out.length < n) {
          if (!deck.length) deck = [...POOL].sort(() => Math.random() - 0.5);
          out.push(deck.pop());
        }
        return out;
      }
      const lg = (item) => item.th.replace("/small/", "/lg/");
      const short = (id) => id;

      // The Judgement shape from "What a Judgement records" (wallpapi-wa5.2), in memory only.
      const log = [];
      let pairs = 0, absolutes = 0;
      const startedAt = Date.now();
      function record(instrument, shown, firstShown, items, judgementLevel, evidence, extra = {}) {
        const j = {
          install: "prototype", seq: log.length + 1,
          instrument: { name: instrument, version: 1 }, screen: "compare",
          first_shown: new Date(firstShown).toISOString().slice(11, 19),
          submitted: new Date().toISOString().slice(11, 19),
          seconds: +((Date.now() - firstShown) / 1000).toFixed(1),
          shown: shown.map((i) => i.id),
          provenance: Object.fromEntries(shown.map((i, n) => [i.id, { zone: "unknown", mix: "Explore", slot: n }])),
          response: { items, judgement: judgementLevel },
          context: { theme: document.documentElement.getAttribute("data-theme") || "system", ...extra },
        };
        log.push(j);
        pairs += evidence.filter((e) => e.includes(">")).length;
        absolutes += evidence.filter((e) => !e.includes(">")).length;
        document.getElementById("last").textContent = JSON.stringify(j, null, 1);
        document.getElementById("evidence").textContent = evidence.length ? evidence.join("\n") : "(none)";
        stats();
      }
      function stats() {
        const mins = (Date.now() - startedAt) / 60000;
        document.getElementById("s-j").textContent = log.length;
        document.getElementById("s-p").textContent = pairs;
        document.getElementById("s-a").textContent = absolutes;
        document.getElementById("s-m").textContent = mins.toFixed(1);
        document.getElementById("s-ppm").textContent = mins > 0.05 ? (pairs / mins).toFixed(0) : "–";
        const secs = log.length ? log.reduce((s, j) => s + j.seconds, 0) / log.length : 0;
        document.getElementById("s-spj").textContent = log.length ? secs.toFixed(1) : "–";
      }
      setInterval(stats, 5000);

      function tile(item, { big = false, keyLabel = null } = {}) {
        const el = document.createElement("div");
        el.className = "tile";
        el.dataset.id = item.id;
        el.innerHTML = `<img src="${big ? lg(item) : item.th}" alt="${item.id}" loading="lazy" draggable="false" />`
          + (keyLabel ? `<span class="key">${keyLabel}</span>` : "");
        return el;
      }
      function action(html) {
        const li = document.createElement("li");
        li.innerHTML = html;
        actions.appendChild(li);
        return li.firstElementChild;
      }

      // A: pick 1 of n. Click the best (or press its number); "None of these" is a Judgement-level Response.
      function variantA() {
        let n = +(params.get("n") || 4);
        const sel = action(`<select aria-label="n">${[2, 3, 4, 6].map((k) =>
          `<option ${k === n ? "selected" : ""}>${k}</option>`).join("")}</select>`);
        sel.style.marginBottom = 0;
        const none = action(`<button class="secondary outline">None of these (0)</button>`);
        stage.innerHTML = `<p class="hint">Click the one you like most, or press its number. The next set
          appears at once. "None of these" says the whole set misses.</p><div class="pick"></div>`;
        const grid = stage.querySelector(".pick");
        let shown, firstShown;
        function deal() {
          grid.className = `pick n${n}`;
          shown = draw(n);
          firstShown = Date.now();
          grid.replaceChildren(...shown.map((it, k) => {
            const el = tile(it, { big: true, keyLabel: k + 1 });
            el.onclick = () => pick(k);
            return el;
          }));
        }
        function pick(k) {
          const w = shown[k];
          const items = Object.fromEntries(shown.map((it, i) => [it.id, i === k ? { picked: true } : {}]));
          record("pick-1-of-n", shown, firstShown, items, { n },
            shown.filter((_, i) => i !== k).map((l) => `${short(w.id)} > ${short(l.id)}`));
          deal();
        }
        none.onclick = () => {
          record("pick-1-of-n", shown, firstShown, {}, { n, none: true },
            ["(none of these: weak − on all? the reduction decides)"]);
          deal();
        };
        sel.onchange = () => { n = +sel.value; deal(); };
        addEventListener("keydown", (e) => {
          if (e.key === "0") none.click();
          const k = +e.key - 1;
          if (k >= 0 && k < n) pick(k);
        });
        deal();
      }

      // B: drag to order five. Leftmost is best. Submit records the whole order.
      function variantB() {
        const submit = action(`<button>Submit order</button>`);
        stage.innerHTML = `<p class="hint">Drag the tiles into order, best on the left, then Submit.
          Five Items give ten pairs.</p><div class="order"></div>`;
        const row = stage.querySelector(".order");
        let shown, firstShown, dragged;
        function ranks() {
          [...row.children].forEach((el, i) => { el.querySelector(".rank").textContent = i + 1; });
        }
        function deal() {
          shown = draw(5);
          firstShown = Date.now();
          row.replaceChildren(...shown.map((it) => {
            const el = tile(it, { big: true });
            el.insertAdjacentHTML("beforeend", `<span class="rank"></span>`);
            el.draggable = true;
            el.ondragstart = () => { dragged = el; el.classList.add("dragging"); };
            el.ondragend = () => { el.classList.remove("dragging"); ranks(); };
            el.ondragover = (e) => { e.preventDefault(); el.classList.add("over"); };
            el.ondragleave = () => el.classList.remove("over");
            el.ondrop = (e) => {
              e.preventDefault();
              el.classList.remove("over");
              if (!dragged || dragged === el) return;
              const all = [...row.children];
              row.insertBefore(dragged, all.indexOf(dragged) < all.indexOf(el) ? el.nextSibling : el);
              ranks();
            };
            return el;
          }));
          ranks();
        }
        submit.onclick = () => {
          const order = [...row.children].map((el) => el.dataset.id);
          const moved = order.some((id, i) => id !== shown[i].id);
          const ev = [];
          for (let i = 0; i < order.length; i++)
            for (let j = i + 1; j < order.length; j++) ev.push(`${short(order[i])} > ${short(order[j])}  (gap ${j - i})`);
          record("drag-to-order", shown, firstShown, Object.fromEntries(order.map((id, i) => [id, { rank: i + 1 }])),
            { untouched: !moved }, moved ? ev : ["(order untouched: the presence rule says nothing was said)"]);
          deal();
        };
        deal();
      }

      // C: endless wall. Click to pluck. A page of 24 closes as one Judgement once its last row has scrolled
      // above the screen; a page with no pluck is recorded but says nothing (the presence rule).
      function variantC() {
        stage.innerHTML = `<p class="hint">Scroll. Click anything that catches your eye (click again to undo).
          Every 24 tiles is one Judgement, closed once you scroll past it.</p><div class="wall"></div>`;
        const wall = stage.querySelector(".wall");
        const pages = [];
        function addPage() {
          const items = draw(24);
          const page = { no: pages.length + 1, items, firstShown: Date.now(), plucked: new Set(), seen: new Set(),
                         closed: false, last: null };
          pages.push(page);
          const br = document.createElement("div");
          br.className = "pagebreak";
          br.textContent = `page ${page.no}`;
          wall.appendChild(br);
          items.forEach((it) => {
            const el = tile(it);
            el.onclick = () => {
              if (page.closed) return;
              el.classList.toggle("plucked");
              page.plucked.has(it.id) ? page.plucked.delete(it.id) : page.plucked.add(it.id);
            };
            seenObserver.observe(el);
            el._page = page;
            wall.appendChild(el);
            page.last = el;
          });
        }
        function close(page) {
          page.closed = true;
          const passed = page.items.filter((it) => !page.plucked.has(it.id));
          const acted = page.plucked.size > 0;
          const ev = acted ? [
            ...[...page.plucked].map((id) => `${short(id)} +weak`),
            ...[...page.plucked].flatMap((id) => passed.filter((p) => page.seen.has(p.id))
              .map((p) => `${short(id)} > ${short(p.id)}  (weak)`)),
          ] : ["(no pluck on this page: presence rule, nothing said)"];
          record("endless-wall", page.items, page.firstShown,
            Object.fromEntries(page.items.map((it) => [it.id,
              { plucked: page.plucked.has(it.id), seen: page.seen.has(it.id) }])),
            { page: page.no }, ev);
        }
        const seenObserver = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) e.target._page.seen.add(e.target.dataset.id); });
        }, { threshold: 0.6 });
        addEventListener("scroll", () => {
          pages.forEach((p) => { if (!p.closed && p.last.getBoundingClientRect().bottom < 0) close(p); });
          if (innerHeight + scrollY > document.body.scrollHeight - 800) addPage();
        });
        addPage(); addPage();
      }

      // D: winner stays. Two big; click the better; the loser is replaced, the winner keeps its streak.
      function variantD() {
        const both = action(`<button class="secondary outline">Neither (0)</button>`);
        stage.innerHTML = `<p class="hint">Click the better of the two, or press 1 or 2. The winner stays and a
          new challenger replaces the loser.</p><div class="duel"></div>`;
        const duel = stage.querySelector(".duel");
        let pair = draw(2), streak = [0, 0], firstShown = Date.now();
        function render() {
          duel.replaceChildren(...pair.map((it, k) => {
            const el = tile(it, { big: true, keyLabel: k + 1 });
            if (streak[k] > 0) el.insertAdjacentHTML("beforeend", `<span class="champ">♛ ${streak[k]}</span>`);
            el.onclick = () => win(k);
            return el;
          }));
          firstShown = Date.now();
        }
        function win(k) {
          const w = pair[k], l = pair[1 - k];
          record("winner-stays", pair, firstShown, { [w.id]: { picked: true }, [l.id]: {} },
            { streak: streak[k] + 1 }, [`${short(w.id)} > ${short(l.id)}`]);
          streak[k] += 1; streak[1 - k] = 0;
          pair[1 - k] = draw(1)[0];
          render();
        }
        both.onclick = () => {
          record("winner-stays", pair, firstShown, {}, { neither: true }, ["(neither: weak − on both? the reduction decides)"]);
          pair = draw(2); streak = [0, 0]; render();
        };
        addEventListener("keydown", (e) => {
          if (e.key === "1") win(0);
          if (e.key === "2") win(1);
          if (e.key === "0") both.click();
        });
        render();
      }

      ({ A: variantA, B: variantB, C: variantC, D: variantD })[variant]();

      // The switcher.
      document.getElementById("vlabel").textContent = `${variant} (${VARIANTS[variant]})`;
      function go(step) {
        const next = KEYS[(KEYS.indexOf(variant) + step + KEYS.length) % KEYS.length];
        params.set("variant", next);
        location.search = params.toString();
      }
      document.getElementById("prev").onclick = () => go(-1);
      document.getElementById("next").onclick = () => go(1);
      addEventListener("keydown", (e) => {
        if (e.target.closest("input, textarea, select, [contenteditable]")) return;
        if (e.key === "ArrowLeft") go(-1);
        if (e.key === "ArrowRight") go(1);
      });
    </script>
  </body>
</html>
